name: Installation and content regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installation:
    name: Isolated Runtime installation / Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm run test:install
  content:
    name: Python content and Work / Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned content dependencies
        run: python -m pip install ./python
      - name: Run content regression with an explicit interpreter
        shell: pwsh
        run: |
          $python = (Get-Command python).Source
          $env:ATLAS_CONTENT_PYTHON = $python
          $env:ATLAS_DESKTOP_PYTHON = $python
          $env:ATLAS_TEST_PYTHON = $python
          npm run test:content
